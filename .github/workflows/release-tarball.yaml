name: Release tarball

# Publish a GitHub release whose tag is an OVMS version (for example
# 2026.4.1). This workflow then downloads the openvino-model-server-2404 snap
# with that version from the Snap Store, unpacks its ovms/ tree and attaches
# it to the release as openvino-model-server-2404_<version>_amd64.tar.gz
# (+ .sha256). The tarball contains exactly the bits of the published snap.
#
# The snap must already be published (see snap.yaml) in the channel given
# below (default: latest/edge). Tag suffixes after '+' (e.g. 2026.4.1+1 for a
# re-release) are ignored when matching the snap version.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the tarball to
        required: true
        type: string
      channel:
        description: Snap Store channel to download from
        required: false
        default: latest/edge
        type: string

jobs:
  tarball:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # for uploading release assets
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      CHANNEL: ${{ inputs.channel || 'latest/edge' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download snap
        id: download
        run: |
          version="${TAG%%+*}"; version="${version#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          sudo apt-get -qq update && sudo apt-get -qq install -y squashfs-tools
          snap download openvino-model-server-2404 --channel="$CHANNEL" --basename=ovms
          got="$(unsquashfs -cat ovms.snap meta/snap.yaml | awk '/^version:/ {gsub(/["\x27]/, "", $2); print $2}')"
          if [ "$got" != "$version" ]; then
            echo "::error::$CHANNEL has version $got, release tag wants $version"
            exit 1
          fi

      - name: Check the tree is self-contained
        run: |
          sudo snap install core24
          unsquashfs -q -d unpacked ovms.snap ovms
          tests/check-tree.sh unpacked/ovms

      - name: Make tarball
        run: scripts/make-tarball.sh ovms.snap dist "${{ steps.download.outputs.version }}"

      - name: Smoke test the tarball (CPU)
        run: |
          mkdir -p t && tar -C t -xzf dist/*.tar.gz
          tests/smoke-test.sh ./t/ovms/bin/ovms

      - name: Upload to release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
