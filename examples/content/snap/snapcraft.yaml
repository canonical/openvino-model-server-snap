name: ovms-consumer-content
base: core24
version: "0.1"
summary: Example consumer of openvino-model-server-2404 via the content interface
description: |
  Mounts the ovms/ and gpu-runtime/ trees of the installed
  openvino-model-server-2404 snap at $SNAP/ovms and $SNAP/gpu-runtime at
  runtime. Delivery mechanism 2 in the openvino-model-server-snap README.
grade: devel
confinement: strict

platforms:
  amd64:

plugs:
  openvino-model-server:
    interface: content
    content: openvino-model-server-2404
    target: $SNAP/ovms
    default-provider: openvino-model-server-2404
  # Drop this plug (and its mount point below) to bring your own GPU runtime.
  intel-gpu-runtime:
    interface: content
    content: openvino-model-server-2404-gpu-runtime
    target: $SNAP/gpu-runtime
    default-provider: openvino-model-server-2404
  npu-libs:
    interface: content
    content: npu-libs-2404
    target: $SNAP/npu-libs

parts:
  launcher:
    plugin: dump
    source: launcher

apps:
  ovms:
    command: bin/ovms
    plugs: [network-bind, opengl, accel, npu-libs]
